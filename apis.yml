aid: openwork
name: Openwork
description: >-
  OpenWork is an open-source, enterprise-ready alternative to Claude Cowork — a
  desktop application and agent runtime, built as a GUI for OpenCode, that lets
  people work on their local files with AI agents using any of 50+ model
  providers and their own keys. Teams package skills, MCP servers, plugins, and
  configs into shareable one-click setups, and administer rollout, SSO, audit,
  and policy through OpenWork Den, the cloud control plane. The Den API
  (OpenAPI 3.1, 214 operations) exposes organizations, members, roles, SSO and
  SCIM provisioning, connectors, capability sources, LLM providers, workers,
  marketplaces, plugins, and MCP connections, secured by session bearer tokens
  and organization API keys with an OAuth 2.0 / OIDC authorization server.
url: https://raw.githubusercontent.com/api-evangelist/openwork/refs/heads/main/apis.yml
x-type: company
x-source: vc-portfolio
x-backed-by:
- y-combinator
