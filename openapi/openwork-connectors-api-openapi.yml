            schema:
              type: object
              properties:
                autoImportNewPlugins:
                  type: boolean
              required:
              - autoImportNewPlugins
      tags:
      - Connectors
      summary: Set connector instance auto-import
      description: Enables or disables auto-import of new plugins on future push webhooks for a connector instance.
      responses:
