      operationId: getV1ConnectorInstancesByConnectorInstanceIdConfiguration
      parameters:
      - in: path
        name: connectorInstanceId
        schema:
          format: typeid
          type: string
          minLength: 30
          maxLength: 30
          pattern: ^cin_.*
        required: true
        description: Den TypeID with 'cin_' prefix and a 26-character base32 suffix.
      tags:
