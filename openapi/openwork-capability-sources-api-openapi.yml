  /v1/mcp-connections/presets:
    get:
      operationId: getV1McpConnectionsPresets
      tags:
      - Capability Sources
      summary: List predefined External MCP Connection presets
      description: Common third-party MCP servers (Notion, Linear, Stripe, Slack, ...) an admin can add with one click, prefilled with a real name and URL.
      responses:
        '200':
          description: Presets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalMcpPresetListResponse'
        '401':
          description: The caller must be signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
  /v1/mcp-connections:
    get:
      operationId: getV1McpConnections
      tags:
      - Capability Sources
      summary: List External MCP Connections
      description: 'scope=usable (default): connections the calling member has been granted (org-wide, direct, or via a team), with per-member connection status. scope=manageable: every org connection with access summaries — workspace owners and admins only.'
      responses:
        '200':
          description: Connections.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalMcpConnectionListResponse'
        '401':
          description: The caller must be signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: scope=manageable requires a workspace owner or admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
      parameters:
      - in: query
        name: scope
        schema:
          default: usable
          type: string
          enum:
          - usable
          - manageable
    post:
      operationId: postV1McpConnections
      tags:
      - Capability Sources
      summary: Register a new External MCP Connection for the org
      description: Admin-only. Registers a third-party MCP server by name + URL and grants access (org-wide, teams, or members). Use GET /v1/mcp-connections/presets for known server URLs (Notion, Linear, Stripe, Sentry, Slack, Context7). For credentialMode per_member, each member connects their own account afterwards — share links.yourConnections from the response so teammates know where to sign in. For servers with pre-registered OAuth apps, whitelist links.oauthCallback. API-key and OAuth-client credentials cannot be created through the agent surface; use the dashboard.
      responses:
        '200':
          description: Connection created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalMcpConnectionCreatedResponse'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestError'
        '401':
          description: The caller must be signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: Only workspace owners and admins can add MCP connections.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '502':
          description: The upstream MCP server could not be reached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalMcpConnectionValidationFailedError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
                url:
                  type: string
                  maxLength: 2048
                  format: uri
                authType:
                  type: string
                  enum:
                  - oauth
                  - apikey
                  - none
                credentialMode:
                  default: shared
                  type: string
                  enum:
                  - shared
                  - per_member
                apiKey:
                  type: string
                  minLength: 1
                  maxLength: 4096
                oauthClient:
                  type: object
                  properties:
                    clientId:
                      type: string
                      minLength: 1
                      maxLength: 512
                    clientSecret:
                      type: string
                      minLength: 1
                      maxLength: 4096
                    tokenEndpointAuthMethod:
                      type: string
                      enum:
                      - client_secret_basic
                      - client_secret_post
                  required:
                  - clientId
                authorizationServerIssuer:
                  anyOf:
                  - type: string
                    maxLength: 2048
                    format: uri
                  - type: 'null'
                requestedScopes:
                  default: []
                  maxItems: 100
                  type: array
                  items:
                    type: string
                    minLength: 1
                    maxLength: 255
                access:
                  $ref: '#/components/schemas/ExternalMcpConnectionAccessInput'
              required:
              - name
              - url
              - authType
  /v1/mcp-connections/{connectionId}/tools:
    get:
      operationId: getV1McpConnectionsByConnectionIdTools
      tags:
      - Capability Sources
      summary: List tools exposed by an External MCP Connection
      description: Uses the Den-managed credential available to the calling member to read the live MCP tools/list catalog. Granted members can inspect connections available under Your Connections; workspace owners and admins can also inspect connections they manage. Credentials and tool calls are never returned.
      responses:
        '200':
          description: External MCP tool catalog.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalMcpConnectionToolListResponse'
        '401':
          description: The caller must be signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: The caller has not been granted access to this connection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '404':
          description: Unknown connection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalMcpConnectionNotFoundError'
        '409':
          description: The connection has no usable credential for this member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalMcpConnectionNotReadyError'
        '502':
          description: The upstream MCP tool catalog could not be read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalMcpConnectionToolListFailedError'
      parameters:
      - in: path
        name: connectionId
        schema:
          format: typeid
          type: string
          minLength: 30
          maxLength: 30
          pattern: ^emc_.*
        required: true
        description: Den TypeID with 'emc_' prefix and a 26-character base32 suffix.
  /v1/mcp-connections/{connectionId}/access:
    put:
      operationId: putV1McpConnectionsByConnectionIdAccess
      tags:
      - Capability Sources
      summary: Replace who can use an External MCP Connection
      description: 'Admin-only. Full-replace semantics: send the complete desired access set (orgWide, or memberIds + teamIds). Team and member ids come from GET /v1/org.'
      responses:
        '200':
          description: Access updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalMcpConnectionResponse'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestError'
        '401':
          description: The caller must be signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: Only workspace owners and admins can change connection access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '404':
          description: Unknown connection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalMcpConnectionNotFoundError'
      parameters:
      - in: path
        name: connectionId
        schema:
          format: typeid
          type: string
          minLength: 30
          maxLength: 30
          pattern: ^emc_.*
        required: true
        description: Den TypeID with 'emc_' prefix and a 26-character base32 suffix.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                access:
                  $ref: '#/components/schemas/ExternalMcpConnectionAccessInput'
              required:
              - access
  /v1/capabilities/telegram/status:
    get:
      operationId: getV1CapabilitiesTelegramStatus
      tags:
      - Capability Sources
      summary: Check the organization Telegram connection
      description: Returns redacted Telegram connection and pairing status without any credential material.
      responses:
        '200':
          description: Telegram connection status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelegramCapabilityStatus'
        '401':
          description: The caller must be signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
  /v1/capabilities/telegram/send-message:
    post:
      operationId: postV1CapabilitiesTelegramSendMessage
      tags:
      - Capability Sources
      summary: Send a message to the paired Telegram chat
      description: Sends text only to the organization connection's paired private chat. The caller cannot supply an arbitrary Telegram chat id.
      responses:
        '200':
          description: Telegram message sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelegramSendResponse'
        '400':
          description: The message was invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestError'
        '401':
          description: The caller must be signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '409':
          description: Telegram is not connected or paired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelegramConnectionError'
        '502':
          description: Telegram rejected the message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelegramConnectionError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
                  minLength: 1
                  maxLength: 32000
              required:
              - text
components:
  schemas:
    GoogleWorkspaceShareDriveFileResponse:
      type: object
      properties:
        ok:
          type: boolean
          const: true
        fileId:
          type: string
        permissionId:
          type: string
        type:
          type: string
        role:
          type: string
      required:
      - ok
      - fileId
      - permissionId
      - type
      - role
    ExternalMcpConnectionAccessSummary:
      type: object
      properties:
        orgWide:
          type: boolean
        memberIds:
          type: array
          items:
            type: string
        teamIds:
          type: array
          items:
            type: string
      required:
      - orgWide
      - memberIds
      - teamIds
    GoogleWorkspaceShareDriveFileBody:
      type: object
      properties:
        type:
          type: string
          enum:
          - user
          - domain
          description: Use type=user to share with one person, or type=domain to share with the entire organization.
        emailAddress:
          description: Required when type=user; pass the person's email address, for example raghav@openworklabs.com.
          type: string
          maxLength: 320
          format: email
          pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
        domain:
          description: Required when type=domain; pass the organization's Google Workspace domain, for example openworklabs.com.
          type: string
          minLength: 1
          maxLength: 255
        role:
          default: reader
          description: Drive permission role to grant.
          type: string
          enum:
          - reader
          - commenter
          - writer
        sendNotificationEmail:
          default: true
          description: Whether Google should email the recipient about the new access.
          type: boolean
      required:
      - type
      additionalProperties: false
    ExternalMcpConnectionListResponse:
      type: object
      properties:
        connections:
          type: array
          items:
            $ref: '#/components/schemas/ExternalMcpConnectionResponse'
      required:
      - connections
    ExternalMcpConnectionRequiredBy:
      type: object
      properties:
        pluginId:
          type: string
        name:
          type: string
      required:
      - pluginId
      - name
    GoogleWorkspaceUpdateCalendarEventBody:
      type: object
      properties:
        createMeetLink:
          type: boolean
          const: true
          description: Set true to add a Google Meet conferencing link to this existing event.
      required:
      - createMeetLink
    TelegramCapabilityStatus:
      type: object
      properties:
        connection:
          anyOf:
          - type: object
            properties:
              id:
                type: string
              status:
                type: string
                enum:
                - active
                - error
              connected:
                type: boolean
              bot:
                type: object
                properties:
                  username:
                    anyOf:
                    - type: string
                    - type: 'null'
                  displayName:
                    type: string
                required:
                - username
                - displayName
              worker:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  status:
                    type: string
                required:
                - id
                - name
                - status
              webhook:
                type: object
                properties:
                  registered:
                    type: boolean
                  lastReceivedAt:
                    anyOf:
                    - type: string
                      format: date-time
                      pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
                    - type: 'null'
                required:
                - registered
                - lastReceivedAt
              pairing:
                type: object
                properties:
                  paired:
                    type: boolean
                required:
                - paired
            required:
            - id
            - status
            - connected
            - bot
            - worker
            - webhook
            - pairing
          - type: 'null'
      required:
      - connection
    GoogleWorkspaceNeedsConnectionError:
      type: object
      properties:
        error:
          type: string
          const: needs_connection
        message:
          type: string
      required:
      - error
      - message
    Microsoft365MailMessageSummary:
      type: object
      properties:
        id:
          type: string
        conversationId:
          type: string
        subject:
          type: string
        receivedDateTime:
          type: string
        preview:
          type: string
        from:
          anyOf:
          - $ref: '#/components/schemas/Microsoft365EmailAddress'
          - type: 'null'
        to:
          type: array
          items:
            $ref: '#/components/schemas/Microsoft365EmailAddress'
        webLink:
          type: string
        hasAttachments:
          type: boolean
      required:
      - id
      - conversationId
      - subject
      - receivedDateTime
      - preview
      - from
      - to
      - webLink
      - hasAttachments
    GoogleWorkspaceCalendarEvent:
      type: object
      properties:
        id:
          type: string
        summary:
          type: string
        description:
          type: string
        location:
          type: string
        start:
          type: string
        end:
          type: string
        status:
          type: string
        htmlLink:
          type: string
        attendees:
          type: array
          items:
            type: string
        meetLink:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - id
      - summary
      - description
      - location
      - start
      - end
      - status
      - htmlLink
      - attendees
      - meetLink
    GoogleWorkspaceGmailMessageSummary:
      type: object
      properties:
        id:
          type: string
        threadId:
          type: string
        from:
          type: string
        to:
          type: string
        subject:
          type: string
        date:
          type: string
        snippet:
          type: string
      required:
      - id
      - threadId
      - from
      - to
      - subject
      - date
      - snippet
    Microsoft365CalendarEventBody:
      type: object
      properties:
        subject:
          type: string
          minLength: 1
          maxLength: 255
        body:
          type: string
          maxLength: 20000
        start:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        end:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        timeZone:
          default: UTC
          type: string
          minLength: 1
          maxLength: 100
        location:
          type: string
          maxLength: 255
        attendees:
          maxItems: 100
          type: array
          items:
            type: string
            format: email
            pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
      required:
      - subject
      - start
      - end
    NotFoundError:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required:
      - error
    Microsoft365TeamsMessageBody:
      type: object
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 20000
      required:
      - content
    TelegramSendResponse:
      type: object
      properties:
        ok:
          type: boolean
          const: true
        messageIds:
          type: array
          items:
            type: integer
            minimum: -9007199254740991
            maximum: 9007199254740991
      required:
      - ok
      - messageIds
    Microsoft365MailMessageResponse:
      type: object
      properties:
        ok:
          type: boolean
          const: true
        message:
          $ref: '#/components/schemas/Microsoft365MailMessage'
      required:
      - ok
      - message
    ForbiddenError:
      type: object
      properties:
        error:
          type: string
          enum:
          - forbidden
          - reauth
        reason:
          type: string
        message:
          type: string
      required:
      - error
    GoogleWorkspaceDriveFileResponse:
      type: object
      properties:
        ok:
          type: boolean
          const: true
        file:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
            mimeType:
              type: string
            modifiedTime:
              type: string
            webViewLink:
              type: string
            size:
              anyOf:
              - type: string
              - type: 'null'
            content:
              type: string
            truncated:
              type: boolean
          required:
          - id
          - name
          - mimeType
          - modifiedTime
          - webViewLink
          - size
          - content
          - truncated
      required:
      - ok
      - file
    Microsoft365TeamsChatsResponse:
      type: object
      properties:
        ok:
