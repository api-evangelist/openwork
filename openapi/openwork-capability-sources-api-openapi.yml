        '502':
          description: Microsoft Graph rejected the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Microsoft365GraphError'
      parameters:
      - $ref: '#/components/parameters/Microsoft365TeamsChatsQuery'
  /v1/capabilities/microsoft-365/teams-chats/{chatId}/messages:
    get:
      operationId: getV1CapabilitiesMicrosoft365TeamsChatsByChatIdMessages
      tags:
      - Capability Sources
      summary: List messages in a Microsoft Teams chat as the calling member
      description: Reads recent messages from one Teams chat using delegated Chat.Read permission.
      responses:
        '200':
          description: Teams chat messages returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Microsoft365TeamsMessagesResponse'
        '401':
          description: The caller must be signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '409':
          description: The calling member has not connected their Microsoft account or is missing permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Microsoft365NeedsConnectionError'
        '502':
          description: Microsoft Graph rejected the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Microsoft365GraphError'
      parameters:
      - $ref: '#/components/parameters/Microsoft365TeamsChatParams'
      - $ref: '#/components/parameters/Microsoft365TeamsMessagesQuery'
    post:
      operationId: postV1CapabilitiesMicrosoft365TeamsChatsByChatIdMessages
      tags:
      - Capability Sources
      summary: Send a message to an existing Microsoft Teams chat as the calling member
      description: Sends one message to an existing Teams chat. The operation cannot create a new chat.
      responses:
        '200':
          description: Teams chat message sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Microsoft365TeamsMessageResponse'
        '401':
          description: The caller must be signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '409':
          description: The calling member has not connected their Microsoft account or is missing permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Microsoft365NeedsConnectionError'
        '502':
          description: Microsoft Graph rejected the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Microsoft365GraphError'
      parameters:
      - $ref: '#/components/parameters/Microsoft365TeamsChatParams'
